<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>메르칸티스 — 실시간 멀티플레이</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');
  :root{
    --ink:#120e0a; --panel:#1c150e; --panel-2:#251b12;
    --cream:#e9dcc0; --cream-dim:#ab9b78;
    --attack:#7a1f2b; --attack-dim:#4a1420;
    --coop:#5b4a8a; --coop-dim:#392c5c;
    --gold:#b8912f; --line:#3c2f1f;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--ink); color:var(--cream); font-family:'IBM Plex Sans KR', sans-serif;
    min-height:100vh; display:flex; justify-content:center; padding:14px; }
  #app{ width:100%; max-width:460px; }
  h1{ font-family:'Noto Serif KR', serif; font-weight:900; font-size:24px; margin:4px 0 2px; }
  .sub{ color:var(--cream-dim); font-size:13px; margin-bottom:14px; line-height:1.5; }
  .card-box{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label.field-label{ font-size:12.5px; color:var(--cream-dim); display:block; margin-bottom:4px; }
  input.text-input{ width:100%; padding:11px 12px; margin-bottom:12px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--cream); font-size:15px; font-family:'IBM Plex Sans KR', sans-serif; }
  .primary-btn{ width:100%; padding:13px 0; border:none; border-radius:10px; background:var(--attack);
    color:#f5e9e2; font-size:15px; font-weight:700; margin-top:4px; }
  .primary-btn:disabled{ opacity:0.35; }
  .ghost-btn{ width:100%; padding:11px 0; border-radius:10px; border:1px solid var(--line);
    background:transparent; color:var(--cream-dim); font-size:13.5px; margin-top:8px; }
  .player-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 4px;
    border-bottom:1px solid var(--line); font-size:14px; }
  .player-row .tag-host{ color:var(--gold); font-size:11px; margin-left:6px; }
  .player-row.status-dead{ opacity:0.35; }
  .code-display{ text-align:center; font-family:'Cinzel',serif; font-size:30px; font-weight:800;
    letter-spacing:6px; color:var(--gold); margin:6px 0 12px; }
  #log{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-size:12.5px; color:var(--cream-dim); max-height:120px; overflow-y:auto; margin-bottom:12px; line-height:1.6; }
  .legend{ text-align:center; font-size:12px; color:var(--cream-dim); margin-bottom:6px; }
  .legend b.a{ color:var(--attack); } .legend b.c{ color:var(--coop); }
  #hand{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; }
  .card{ position:relative; flex:0 0 auto; width:58px; height:80px; border-radius:8px; border:1.5px solid var(--line);
    background:var(--panel-2); display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Noto Serif KR', serif; cursor:pointer; }
  .card.attack{ border-color:var(--attack-dim); }
  .card.attack .num{ font-size:24px; font-weight:900; color:var(--attack); font-family:'Cinzel',serif; }
  .card.defense{ border-color:#7a6a3a; }
  .card.shield{ border-color:var(--coop-dim); }
  .card .label{ font-size:9.5px; margin-top:3px; color:var(--cream-dim); }
  .card.disabled{ opacity:0.35; pointer-events:none; }
  .card.via-trade{ border-color:var(--coop); border-width:2px; }
  .card.via-trade::after{ content:'🤝'; position:absolute; top:-7px; right:-7px; font-size:12px;
    background:var(--ink); border-radius:50%; line-height:1; padding:1px; }
  #status-line{ text-align:center; font-size:13px; color:var(--gold); min-height:18px; margin-bottom:8px; }
  #modal-overlay{ position:fixed; inset:0; background:rgba(10,7,5,0.75); display:none;
    align-items:center; justify-content:center; padding:20px; z-index:50; }
  #modal-overlay.show{ display:flex; }
  #modal{ background:var(--panel); border:1px solid var(--gold); border-radius:14px; padding:20px; max-width:340px; width:100%; }
  #modal h3{ font-family:'Noto Serif KR', serif; margin:0 0 8px; font-size:17px; }
  #modal p{ font-size:13px; color:var(--cream-dim); margin:0 0 16px; line-height:1.5; }
  #modal.rules-modal{ max-height:80vh; display:flex; flex-direction:column; }
  .rules-scroll{ overflow-y:auto; flex:1; margin-bottom:14px; }
  .rules-scroll h4{ font-family:'Noto Serif KR',serif; color:var(--gold); font-size:14px; margin:14px 0 4px; }
  .rules-scroll h4:first-child{ margin-top:0; }
  .rules-scroll p, .rules-scroll li{ font-size:12.5px; color:var(--cream-dim); line-height:1.6; }
  .rules-scroll ul{ margin:4px 0; padding-left:18px; }
  .rules-scroll table{ width:100%; border-collapse:collapse; font-size:12px; margin:6px 0; }
  .rules-scroll th, .rules-scroll td{ border-bottom:1px solid var(--line); padding:5px 4px; text-align:left; color:var(--cream-dim); }
  .rules-scroll th{ color:var(--cream); }
  #modal .row{ display:flex; gap:8px; }
  #modal button{ flex:1; padding:11px 0; border-radius:8px; border:none; font-size:13px; font-weight:700; }
  #modal .yes{ background:var(--coop); color:#f1ecff; }
  #modal .no{ background:var(--panel-2); color:var(--cream); border:1px solid var(--line); }
  #modal .cancel{ background:transparent; color:var(--cream-dim); border:1px solid var(--line); }
  .conn-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  .conn-ok{ background:#5b8a4c; } .conn-bad{ background:var(--attack); }
  .land-display{ text-align:center; font-size:44px; margin:8px 0 4px; }
  .land-name{ text-align:center; font-family:'Noto Serif KR',serif; font-weight:800; font-size:16px; margin-bottom:10px; }
  .bid-row{ display:flex; align-items:center; justify-content:center; gap:14px; margin:14px 0; }
  .bid-btn{ width:40px; height:40px; border-radius:50%; border:1px solid var(--gold); background:var(--panel-2); color:var(--gold); font-size:20px; font-weight:700; }
  .bid-value{ font-family:'Cinzel',serif; font-size:26px; font-weight:800; min-width:50px; text-align:center; }
  .coin-strip{ display:flex; gap:8px; overflow-x:auto; padding:7px 2px; margin-bottom:10px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .coin-chip{ flex:0 0 auto; font-size:11px; color:var(--cream-dim); background:var(--panel-2);
    border-radius:20px; padding:4px 10px; white-space:nowrap; border:1px solid transparent; }
  .coin-chip b{ color:var(--gold); font-family:'Cinzel',serif; font-weight:800; }
  .coin-chip.me{ border-color:var(--gold); color:var(--cream); }
  .seat-circle{ position:relative; width:100%; max-width:340px; aspect-ratio:1/1; margin:6px auto 18px; }
  .seat-circle::before{ content:''; position:absolute; inset:16%; border:1px dashed var(--line); border-radius:50%; }
  .seat-circle-center{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
  .deck-pile{ position:relative; width:34px; height:46px; margin:0 auto 4px; }
  .deck-pile .deck-card{ position:absolute; inset:0; border-radius:4px; border:1.5px solid var(--gold);
    background:repeating-linear-gradient(135deg, var(--panel-2), var(--panel-2) 4px, var(--line) 4px, var(--line) 8px); }
  .deck-pile .deck-card:nth-child(1){ transform:translate(2px,2px) rotate(-5deg); }
  .deck-pile .deck-card:nth-child(2){ transform:translate(1px,1px) rotate(3deg); }
  .deck-pile .deck-card:nth-child(3){ transform:translate(0,0) rotate(-1deg); }
  .seat-circle-center .deck-count{ font-family:'Cinzel',serif; font-size:13px; font-weight:800; color:var(--gold); line-height:1; }
  .seat-circle-center .turn-label{ font-size:10px; color:var(--cream-dim); margin-top:2px; }
  .seat{ position:absolute; width:84px; transform:translate(-50%,-50%); text-align:center;
    background:var(--panel); border:1.5px solid var(--line); border-radius:12px; padding:6px 4px;
    transition:box-shadow .2s ease, opacity .3s ease; }
  .seat.seat-me{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  .seat.seat-dead{ opacity:0.35; }
  .seat .seat-name{ font-size:11.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .seat .seat-info{ font-size:10px; color:var(--cream-dim); margin-top:2px; line-height:1.3; }
  .seat .seat-mark{ font-size:10px; margin-top:2px; display:block; font-weight:700; }
  .seat .seat-mark.a{ color:var(--attack); } .seat .seat-mark.c{ color:var(--coop); } .seat .seat-mark.g{ color:var(--gold); }
  .seat.seat-fx-guard, .seat.seat-fx-trade{ box-shadow:0 0 0 2px var(--coop); }
  .seat.seat-fx-attack-from{ box-shadow:0 0 0 2px var(--attack); }
  .seat.seat-fx-attack-hit{ box-shadow:0 0 0 2px var(--attack); animation:seatShake .3s; }
  .seat.seat-fx-attack-blocked{ box-shadow:0 0 0 2px var(--gold); }
  .seat.seat-fx-defend{ box-shadow:0 0 0 2px #7a6a3a; }
  .seat.seat-fx-none{ box-shadow:0 0 0 2px var(--line); }
  .seat.seat-fx-eliminate{ opacity:0.25; }
  @keyframes seatShake{ 0%,100%{ transform:translate(-50%,-50%); } 25%{ transform:translate(calc(-50% - 3px),-50%); } 75%{ transform:translate(calc(-50% + 3px),-50%); } }
  .fly-token{ position:absolute; transform:translate(-50%,-50%) scale(0.85); opacity:0;
    transition:left .4s cubic-bezier(.32,.72,.35,1), top .4s cubic-bezier(.32,.72,.35,1),
      opacity .15s ease, transform .4s cubic-bezier(.32,.72,.35,1);
    pointer-events:none; z-index:30; font-size:18px; }
  .fly-token .fly-card{ width:22px; height:30px; border-radius:4px; border:1.5px solid var(--gold);
    background:var(--panel-2); display:flex; align-items:center; justify-content:center;
    font-family:'Cinzel',serif; font-size:12px; font-weight:800; color:var(--gold); }
  .fly-token .fly-card.back{ background:repeating-linear-gradient(135deg, var(--panel-2), var(--panel-2) 3px, var(--line) 3px, var(--line) 6px); }
  .float-text{ position:absolute; transform:translate(-50%,-50%); transition:top .4s ease, opacity .4s ease;
    pointer-events:none; z-index:31; font-weight:800; font-family:'Cinzel',serif; font-size:16px; opacity:1; }
  .float-text.dmg{ color:var(--attack); }
  .float-text.blocked{ color:var(--gold); }
  .timer{ text-align:center; font-family:'Cinzel',serif; font-size:15px; font-weight:800; color:var(--gold); margin-bottom:6px; }
  .timer.timer-low{ color:var(--attack); }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-overlay"><div id="modal"></div></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const GOAL_COINS = 20;
const LAND_ROUNDS_BY_YIELD = { 1: 6, 2: 4, 3: 3 }; // game-logic.js의 LAND_ROUNDS_BY_YIELD와 동일
const TURN_TIMEOUT_MS = 15000;
const BID_TIMEOUT_MS = 15000;
const ANIM_STEP_MS = 430; // 서버 animGraceMs와 동일해야 타이머 표시가 실제 마감과 맞는다 (기존 650의 1.5배 속도)
const socket = io();
let myTag = '', roomCode = '', isHost = false;
let phase = 'landing'; // landing | lobby | game | auction | auction-result | over
let lastLobby = null, lastState = null, gameMeta = null;
let auctionYield = null, lastRoundMsg = '';
let auctionResultBids = null, auctionResultWinner = null, auctionResultYield = null;
let gameOverWinner = null;
let gameOverGoal = GOAL_COINS;
let submittedThisTurn = -1;
let myBid = 0;
let bidSubmitted = false;
let errorMsg = '';
let connected = false;
let lastSeatPositions = {}; // 원형 좌석 렌더링 시 계산된 태그별 {x,y}(%) — 애니메이션 좌표 계산용
let animToken = 0;
let animating = false; // 턴 결과 애니메이션 재생 중에는 손패 클릭을 막아 이전 턴 카드가 다시 제출되는 걸 방지
let timerDeadline = null, timerInterval = null;

socket.on('connect', ()=>{ connected = true; render(); });
socket.on('disconnect', ()=>{ connected = false; render(); });
socket.on('lobby-update', (lobby)=>{
  lastLobby = lobby;
  if(lobby.status==='waiting'){ phase='lobby'; stopTimer(); }
  render();
});
socket.on('state-update', ({state, meta})=>{
  if(state.turn===1) submittedThisTurn = -1; // 새 라운드 시작 — 이전 라운드의 제출 기록 초기화
  gameMeta = meta;
  const prevState = (phase === 'game') ? lastState : null;
  const eventsToPlay = (prevState && state.events && state.events.length) ? state.events : [];
  // 재생 시간만큼 마감을 밀어줘야 애니메이션이 끝난 뒤에도 고민 시간이 15초 그대로 보장된다
  // (서버 animGraceMs와 동일한 계산 — 둘 다 같은 이벤트 수를 세므로 항상 일치한다).
  const deadline = state.turnStartedAt + eventsToPlay.length * ANIM_STEP_MS + TURN_TIMEOUT_MS;
  phase = 'game';
  if(eventsToPlay.length){
    // 화면은 이전 턴 그대로 두고, 이벤트가 재생되는 순간에 맞춰서만 부채/카드 수를 갱신한다 —
    // 공격 애니메이션이 뜨기 전에 부채 숫자가 먼저 올라가 있는 것처럼 보이지 않도록.
    stopTimer();
    playTurnEvents(eventsToPlay, state, true, deadline);
  } else {
    lastState = state;
    render();
    startTimer(deadline);
  }
});
socket.on('submission-update', ()=>{ render(); });
socket.on('round-result', ({msg, meta, state})=>{
  lastRoundMsg = msg; gameMeta = meta;
  stopTimer();
  const prevState = (phase === 'game') ? lastState : null;
  const eventsToPlay = (prevState && state && state.events && state.events.length) ? state.events : [];
  if(eventsToPlay.length){
    // 라운드를 끝낸 마지막 턴도 다른 턴과 똑같이 순차 재생한다 (끝났다고 순간 이동하지 않도록).
    // 다음 순서는 경매이므로 재생이 끝나도 새 턴 타이머는 시작하지 않는다.
    playTurnEvents(eventsToPlay, state, false);
  } else if(state){
    lastState = state;
    render();
  } else {
    render();
  }
});
socket.on('land-auction', ({yieldValue, meta, bidStartedAt})=>{
  auctionYield = yieldValue; gameMeta = meta; myBid = 0; bidSubmitted = false;
  phase = 'auction';
  render();
  startTimer((bidStartedAt || Date.now()) + BID_TIMEOUT_MS);
});
socket.on('bid-submission-update', ()=>{ render(); });
socket.on('land-auction-result', ({meta, bids, winner, yieldValue})=>{
  gameMeta = meta;
  auctionResultBids = bids || {}; auctionResultWinner = winner; auctionResultYield = yieldValue;
  phase = 'auction-result';
  stopTimer();
  render();
});
socket.on('game-over', ({winnerTag, meta, goal})=>{
  gameOverWinner = winnerTag; gameMeta = meta; gameOverGoal = goal || GOAL_COINS;
  phase = 'over';
  stopTimer();
  render();
});

function cardLabel(c){
  if(c.type==='attack') return {label:'부채 전가/밀약', extra:c.value};
  if(c.type==='defense') return {label:'보험', extra:'½'};
  if(c.type==='shield') return {label:'면책', extra:'🛡'};
}
function nextAliveTag(state, tag){
  const order = state.seatOrder; let i = order.indexOf(tag);
  for(let s=0;s<order.length;s++){ i=(i+1)%order.length; if(state.players[order[i]].alive) return order[i]; }
  return tag;
}
function prevAliveTag(state, tag){
  const order = state.seatOrder; let i = order.indexOf(tag);
  for(let s=0;s<order.length;s++){ i=(i-1+order.length)%order.length; if(state.players[order[i]].alive) return order[i]; }
  return tag;
}
function myPlayer(){ return lastState ? lastState.players[myTag] : null; }

/* ================= 턴 타이머 ================= */
function startTimer(deadlineTs){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  timerDeadline = deadlineTs;
  timerInterval = setInterval(updateTimerDisplay, 250);
  updateTimerDisplay();
}
function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  timerDeadline = null;
}
function updateTimerDisplay(){
  const el = document.getElementById('turn-timer');
  if(!el || timerDeadline===null) return;
  const remain = Math.max(0, Math.ceil((timerDeadline - Date.now()) / 1000));
  el.textContent = `⏱ ${remain}초`;
  el.classList.toggle('timer-low', remain <= 5);
}

/* ================= 턴 결과 순차 재생 애니메이션 =================
   화면은 이전 턴 상태를 그대로 유지한 채, 이벤트가 재생되는 "그 순간"에만
   해당 좌석의 부채/카드 수/생존 여부를 갱신한다 — 공격 애니메이션이 뜨기 전에
   숫자가 먼저 바뀌어 있는 것처럼 보이지 않도록 하기 위함. */
function seatCenterPx(circle, tag){
  const pos = lastSeatPositions[tag];
  if(!pos) return null;
  const rect = circle.getBoundingClientRect();
  return { x: rect.width * pos.x / 100, y: rect.height * pos.y / 100 };
}
function circleCenterPx(circle){
  const rect = circle.getBoundingClientRect();
  return { x: rect.width / 2, y: rect.height / 2 };
}
function flyToken(circle, from, to, innerHTML, ms){
  if(!from || !to) return;
  const total = ms || 400;
  const el = document.createElement('div');
  el.className = 'fly-token';
  el.innerHTML = innerHTML;
  el.style.left = from.x + 'px';
  el.style.top = from.y + 'px';
  circle.appendChild(el);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      el.style.left = to.x + 'px';
      el.style.top = to.y + 'px';
      el.style.opacity = '1';
      el.style.transform = 'translate(-50%,-50%) scale(1)';
    });
  });
  setTimeout(()=>{ el.style.opacity = '0'; }, Math.max(0, total - 150));
  setTimeout(()=>{ el.remove(); }, total);
}
function floatText(circle, pos, text, cls){
  if(!pos) return;
  const el = document.createElement('div');
  el.className = 'float-text ' + (cls||'');
  el.textContent = text;
  el.style.left = pos.x + 'px';
  el.style.top = pos.y + 'px';
  circle.appendChild(el);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      el.style.top = (pos.y - 32) + 'px';
      el.style.opacity = '0';
    });
  });
  setTimeout(()=>{ el.remove(); }, 470);
}
function flashSeat(circle, tag, cls, ms){
  let el;
  try{ el = circle.querySelector(`.seat[data-tag="${CSS.escape(tag)}"]`); }catch(e){ return; }
  if(!el) return;
  el.classList.add(cls);
  setTimeout(()=>{ el.classList.remove(cls); }, ms || 550);
}
function setAnimStatus(text){
  const el = document.getElementById('status-line');
  if(el) el.textContent = text;
}
// ev가 실제로 일어나는 시점에 맞춰 local(좌석별 임시 부채/카드수/생존) 값을 갱신
function applyEventToLocal(local, ev){
  if(ev.type === 'guard'){
    local[ev.tag].shield = 1;
  } else if(ev.type === 'trade'){
    local[ev.from].score = Math.max(0, local[ev.from].score - 1);
    local[ev.to].hand += 1;
  } else if(ev.type === 'attack'){
    local[ev.to].score += ev.damage;
  } else if(ev.type === 'eliminate'){
    local[ev.target].alive = false;
    if(ev.attacker) local[ev.attacker].hand += ev.taken;
  } else if(ev.type === 'draw'){
    local[ev.tag].hand += 1;
  }
}
function eventTags(ev){
  if(ev.type === 'trade' || ev.type === 'attack') return [ev.from, ev.to];
  if(ev.type === 'eliminate') return [ev.target, ev.attacker].filter(Boolean);
  if(ev.tag) return [ev.tag];
  return [];
}
function updateSeatDOM(circle, tag, local){
  let el;
  try{ el = circle.querySelector(`.seat[data-tag="${CSS.escape(tag)}"]`); }catch(e){ return; }
  if(!el) return;
  const d = local[tag];
  const info = el.querySelector('.seat-info');
  if(info) info.innerHTML = `부채 ${d.score} · ${d.alive ? d.hand+'장' : '💀'}${d.shield>0 ? ' 🛡' : ''}`;
  el.classList.toggle('seat-dead', !d.alive);
}
function playEvent(circle, ev){
  if(ev.type === 'guard'){
    floatText(circle, seatCenterPx(circle, ev.tag), '🛡', 'blocked');
    flashSeat(circle, ev.tag, 'seat-fx-guard');
    setAnimStatus(`🟢 ${ev.tag}: 면책으로 자기 방어`);
  } else if(ev.type === 'trade'){
    flyToken(circle, seatCenterPx(circle, ev.from), seatCenterPx(circle, ev.to), `<div class="fly-card">${ev.value}</div>`);
    flashSeat(circle, ev.from, 'seat-fx-trade');
    flashSeat(circle, ev.to, 'seat-fx-trade');
    setAnimStatus(`🤝 ${ev.from} → ${ev.to}: 밀약 (카드 ${ev.value} 지원)`);
  } else if(ev.type === 'attack'){
    flashSeat(circle, ev.from, 'seat-fx-attack-from');
    flashSeat(circle, ev.to, ev.damage > 0 ? 'seat-fx-attack-hit' : 'seat-fx-attack-blocked');
    const label = ev.damage > 0 ? `-${ev.damage}` : (ev.blockedBy === 'guard' ? '🛡무효' : '½감소');
    floatText(circle, seatCenterPx(circle, ev.to), label, ev.damage > 0 ? 'dmg' : 'blocked');
    setAnimStatus(`🔴 ${ev.from} → ${ev.to}: 부채 전가(${ev.cardValue})${ev.damage > 0 ? ` · 부채 ${ev.damage}` : ' · 무효화'}`);
  } else if(ev.type === 'defend'){
    flashSeat(circle, ev.tag, 'seat-fx-defend');
    setAnimStatus(`🛡 ${ev.tag}: 보험 가입`);
  } else if(ev.type === 'none'){
    flashSeat(circle, ev.tag, 'seat-fx-none');
    setAnimStatus(`⚠ ${ev.tag}: 국고 탕진`);
  } else if(ev.type === 'eliminate'){
    flashSeat(circle, ev.target, 'seat-fx-eliminate');
    setAnimStatus(`💀 ${ev.target} 파산!${ev.attacker ? ` (${ev.attacker}이(가) 채권 ${ev.taken}건 회수)` : ''}`);
  } else if(ev.type === 'draw'){
    flyToken(circle, circleCenterPx(circle), seatCenterPx(circle, ev.tag), '<div class="fly-card back"></div>');
  }
}
// events: 이번에 재생할 구조화 이벤트 목록. finalState: 재생이 끝나면 화면에 반영할 최종 상태.
// startTimerAfter: 재생이 끝난 뒤 다음 턴 제출 타이머를 시작할지 (라운드를 끝낸 마지막 턴이면 false —
// 다음은 경매이므로 그쪽 타이머가 따로 시작된다).
function playTurnEvents(events, finalState, startTimerAfter, deadline){
  if(startTimerAfter === undefined) startTimerAfter = true;
  const token = ++animToken;
  animating = true;
  // 재생 중에는 이전 턴 손패(이미 낸 카드 포함)를 다시 클릭해 제출하지 못하도록 막아둔다.
  document.querySelectorAll('#hand .card[data-card-id]').forEach(el=>{ el.classList.add('disabled'); el.onclick = null; });
  const circle = document.querySelector('.seat-circle');
  if(!circle){
    animating = false; lastState = finalState; render();
    if(startTimerAfter) startTimer(deadline);
    return;
  }
  // 이전 턴(현재 화면) 기준으로 좌석별 부채/카드수/생존 임시값을 만들고, 이벤트 재생에 맞춰 갱신한다.
  const local = {};
  lastState.seatOrder.forEach(t=>{
    const p = lastState.players[t];
    local[t] = { score: p.score, hand: p.hand.length, alive: p.alive, shield: 0 }; // 매 턴 시작 시 방어막은 초기화됨
  });
  let i = 0;
  function step(){
    if(token !== animToken) return; // 이후 턴 결과가 먼저 도착 — 이 재생은 중단
    if(i >= events.length){
      animating = false;
      lastState = finalState;
      render();
      if(startTimerAfter) startTimer(deadline);
      return;
    }
    const ev = events[i++];
    applyEventToLocal(local, ev);
    eventTags(ev).forEach(t=>updateSeatDOM(circle, t, local));
    playEvent(circle, ev);
    setTimeout(step, ANIM_STEP_MS);
  }
  step();
}

function createRoom(){
  const tag = document.getElementById('tag-input').value.trim();
  if(!tag){ errorMsg='상단 이름을 입력하세요.'; render(); return; }
  socket.emit('create-room', {tag}, (res)=>{
    if(!res.ok){ errorMsg=res.error; render(); return; }
    myTag = tag; roomCode = res.code; isHost = true; phase='lobby'; errorMsg='';
    render();
  });
}
function joinRoom(){
  const tag = document.getElementById('tag-input').value.trim();
  const code = document.getElementById('code-input').value.trim().toUpperCase();
  if(!tag || !code){ errorMsg='상단 이름과 방 코드를 모두 입력하세요.'; render(); return; }
  socket.emit('join-room', {tag, code}, (res)=>{
    if(!res.ok){ errorMsg=res.error; render(); return; }
    myTag = tag; roomCode = res.code; isHost = false; phase='lobby'; errorMsg='';
    render();
  });
}
function hostStartGame(){
  socket.emit('start-game', {}, (res)=>{ if(res && !res.ok){ errorMsg = res.error; render(); } });
}
function leaveRoom(){
  socket.emit('leave-room', {}, (res)=>{
    if(res && !res.ok){ errorMsg = res.error; render(); return; }
    myTag = ''; roomCode = ''; isHost = false; lastLobby = null;
    phase = 'landing'; errorMsg = '';

  });
}

function adjustBid(delta){
  let v = myBid + delta;
  if(v<0) v=0;
  const cap = (gameMeta && gameMeta[myTag]) ? gameMeta[myTag].coins : 0;
  if(v>cap) v=cap;
  myBid = v;
  render();
}

function toggleSelect(cardId){

  if(card.type==='attack'){
    const xt = prevAliveTag(lastState, prevAliveTag(lastState, myTag));
    const lt = nextAliveTag(lastState, myTag);
    showModal({

      body:`부채 전가(${card.value})로 ${lt}에게 부채를 넘길까요, 아니면 밀약으로 ${xt}에 카드를 지원하고 내 부채를 진정시킬까요?`,
      buttons:[

        { label:`밀약 (${xt}에 지원)`, cls:'no', onClick:()=>submitAction('trade', cardId) },
        { label:'취소', cls:'cancel', onClick:()=>{} }
      ]
    });

  }
  if(card.type==='defense'){

      title:'보험을 낼까요?',

        { label:'취소', cls:'cancel', onClick:()=>{} }

    });

  }
  if(card.type==='shield'){
    showModal({
      title:'면책을 낼까요?',
      body:'이번 턴 자신이 받는 부채 전가를 1회 완전히 무효화합니다.',

  const myIndex = Math.max(0, state.seatOrder.indexOf(myTag));
  const radiusPct = 35;
  // 게임설명서 좌석 규칙: 왼쪽=내가 부채를 전가하는 대상, 오른쪽=나에게 부채를 전가하는 상단,
  // 전전 상단(오른쪽의 오른쪽)=밀약 대상. 3인전에서는 전가대상과 밀약대상이 같아질 수 있다.
  // 면책은 오른쪽에게 주는 카드가 아니라 자기 자신을 방어하는 카드이므로 별도 "면책 대상" 표시는 없다.
  const attackTag = nextAliveTag(state, myTag);
  const rightTag = prevAliveTag(state, myTag);
  const tradeTag = prevAliveTag(state, rightTag);
  lastSeatPositions = {};
  const seatsHTML = state.seatOrder.map((t, i)=>{
    const p = state.players[t];
    // 원형 좌석: 나를 맨 아래(6시 방향)에 고정하고, seatOrder 순서(=왼쪽 방향)대로 시계 방향으로 배치
    const offset = (i - myIndex + n) % n;
    const angleDeg = 180 + offset * (360 / n);
    const rad = angleDeg * Math.PI / 180;
    const x = (50 + radiusPct * Math.sin(rad)).toFixed(1);
    const y = (50 - radiusPct * Math.cos(rad)).toFixed(1);
    lastSeatPositions[t] = { x: Number(x), y: Number(y) };
    const isMe = t === myTag;
    const cls = ['seat'];
    if(isMe) cls.push('seat-me');
    if(!p.alive) cls.push('seat-dead');
    const marks = [];
    if(!isMe && attackTag === t && p.alive) marks.push('<span class="seat-mark a">◀전가대상</span>');
    if(!isMe && rightTag === t && p.alive) marks.push('<span class="seat-mark g">⚠나에게 전가</span>');
    if(!isMe && tradeTag === t && p.alive) marks.push('<span class="seat-mark c">🤝밀약대상</span>');
    return `<div class="${cls.join(' ')}" data-tag="${t}" style="left:${x}%;top:${y}%;">
      <div class="seat-name">${t}${isMe?' (나)':''}</div>
      <div class="seat-info">부채 ${p.score} · ${p.alive?p.hand.length+'장':'💀'}${p.shield>0?' 🛡':''}</div>
      ${marks.join('')}
    </div>`;
  }).join('');
  let handHTML = '';
  if(me && me.alive){
    me.hand.forEach(c=>{
      const info = cardLabel(c);
      const tradeCls = c.viaTrade ? ' via-trade' : '';
      handHTML += `<div class="card ${c.type}${tradeCls}" data-card-id="${c.id}">
        <div class="num">${info.extra}</div><div class="label">${info.label}</div></div>`;
    });
  }
  const alreadySubmitted = submittedThisTurn === state.turn;
  let statusText;
  if(!me || !me.alive) statusText = '우리 상단은 파산했습니다. 남은 정세를 지켜보세요.';
  else if(me.hand.length===0) statusText = '낼 카드가 없습니다 — 국고 탕진 상태 (자동 관망 처리됩니다)';
  else if(alreadySubmitted) statusText = '제출 완료. 다른 상단의 결정을 기다리는 중...';
  else statusText = '이번 턴에 낼 카드를 고르세요.';
  const meta = gameMeta || {};
  const coinStrip = state.seatOrder.map(t=>{
    const m = meta[t];
    if(!m) return '';
    return `<div class="coin-chip${t===myTag?' me':''}">${t} <b>${m.coins}</b>코인</div>`;
  }).join('');
  return `
    <h1>메르칸티스</h1>
    <div class="legend">턴 ${state.turn} · 덱 ${state.deck.length}장 남음 · 방코드 ${roomCode} · ${connDot()}</div>
    <div class="timer" id="turn-timer">⏱ --초</div>
    ${coinStrip?`<div class="coin-strip">${coinStrip}</div>`:''}
    <div class="seat-circle">
      <div class="seat-circle-center">
        <div class="deck-pile"><div class="deck-card"></div><div class="deck-card"></div><div class="deck-card"></div></div>
        <div class="deck-count">${state.deck.length}</div>
        <div class="turn-label">턴 ${state.turn}</div>
      </div>
      ${seatsHTML}
    </div>
    <div id="status-line">${statusText}</div>
    <div id="log">${state.log.slice(-30).map(m=>`<div>${m}</div>`).join('')}</div>
    <div id="hand">${handHTML || '<div class="sub">해당 없음</div>'}</div>
  `;
}
function overHTML(){
  const meta = gameMeta || {};
  const table = Object.keys(meta).map(t=>{
    return `<div class="player-row"><span>${t}${t===gameOverWinner?' 🏆':''}</span><span>${meta[t].coins}코인 · 상관 ${meta[t].lands.length}개</span></div>`;
  }).join('');
  return `
    <h1>메르칸티스</h1>
    <div class="card-box">
      <h3 style="font-family:'Noto Serif KR',serif;margin:0 0 8px;">🏆 ${gameOverWinner}, 목표 코인 ${gameOverGoal} 달성으로 교역의 패자가 되다!</h3>
      <div>${table}</div>
    </div>
    <button class="primary-btn" id="reload-btn">새 상단 연합 열기</button>
  `;
}
function attachHandlers(){
  const c1=document.getElementById('create-btn'); if(c1) c1.onclick=createRoom;
  const rb=document.getElementById('rules-btn'); if(rb) rb.onclick=showRulesModal;
  const c2=document.getElementById('join-btn'); if(c2) c2.onclick=joinRoom;
  const c3=document.getElementById('start-game-btn'); if(c3) c3.onclick=hostStartGame;
  const c4=document.getElementById('reload-btn'); if(c4) c4.onclick=()=>location.reload();
  const lr=document.getElementById('leave-room-btn'); if(lr) lr.onclick=leaveRoom;
  const ab=document.getElementById('add-bot-btn'); if(ab) ab.onclick=addBot;
  document.querySelectorAll('[data-remove-bot]').forEach(el=>{
    el.onclick = ()=>removeBot(el.dataset.removeBot);
  });
  const bm=document.getElementById('bid-minus'); if(bm) bm.onclick=()=>adjustBid(-1);
  const bp=document.getElementById('bid-plus'); if(bp) bp.onclick=()=>adjustBid(1);
  const sb=document.getElementById('submit-bid-btn'); if(sb) sb.onclick=submitBid;
  document.querySelectorAll('.card[data-card-id]').forEach(el=>{
    const alreadySubmitted = lastState && submittedThisTurn===lastState.turn;
    if(alreadySubmitted || animating){ el.classList.add('disabled'); return; }
    el.onclick = ()=>toggleSelect(Number(el.dataset.cardId));
  });
}
render();
</script>
</body>
</html>
